<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .hex-border { fill: #ffffff; stroke: #18181b; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .hex-inner { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 4, 3; opacity: 0.85; }
      .letter-k { fill: none; stroke: #18181b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .letter-r { fill: none; stroke: #2563eb; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
      .node-dot { fill: #dc2626; stroke: #18181b; stroke-width: 1.5; }
      .node-blue { fill: #2563eb; }
      @media (prefers-color-scheme: dark) {
        .hex-border { fill: #0f1118; stroke: #f4f4f5; }
        .hex-inner { stroke: #60a5fa; }
        .letter-k { stroke: #f4f4f5; }
        .letter-r { stroke: #60a5fa; }
        .node-dot { fill: #ef4444; stroke: #ffffff; }
        .node-blue { fill: #60a5fa; }
      }
    </style>
  </defs>

  <!-- Hexagon Die (Qualcomm Hexagon Silicon shape) -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" class="hex-border" />
  <polygon points="50,13 82,31 82,69 50,87 18,69 18,31" class="hex-inner" />

  <!-- Compiler Flow Nodes (Top & Bottom) -->
  <circle cx="50" cy="13" r="3" class="node-dot" />
  <circle cx="50" cy="87" r="3" class="node-dot" />

  <!-- Monogram: Stylized 'K' (Charcoal / Dark) -->
  <!-- Stem -->
  <path d="M 33 28 L 33 72" class="letter-k" />
  <!-- Upper Arm -->
  <path d="M 33 50 L 53 30" class="letter-k" />
  <!-- Lower Arm -->
  <path d="M 40 44 L 56 72" class="letter-k" />

  <!-- Monogram: Stylized 'R' (Cobalt Blue Compiler Flow) -->
  <path d="M 52 32 L 67 32 C 75 32, 75 48, 67 48 L 52 48" class="letter-r" />
  <path d="M 61 48 L 73 72" class="letter-r" />

  <!-- Micro vector dot -->
  <circle cx="67" cy="40" r="2.5" class="node-blue" />
</svg>
